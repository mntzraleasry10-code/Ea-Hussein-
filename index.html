<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>تحدي المواكب الذكي - AI Quiz</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #111827, #1B5E20);
            height: 100dvh;
            overflow: hidden;
            user-select: none;
        }
        
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .option-btn {
            transition: all 0.2s ease;
            border: 2px solid #e5e7eb;
            background-color: white;
        }
        .option-btn:active { transform: scale(0.97); }
        
        .correct { background-color: #10B981 !important; color: white !important; border-color: #10B981 !important; }
        .wrong { background-color: #EF4444 !important; color: white !important; border-color: #EF4444 !important; }
        .disabled-btn { pointer-events: none; opacity: 0.7; }

        /* رسالة التشجيع المنبثقة */
        #praisePopup {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%) scale(0.5);
            background: #D4AF37;
            color: #1B5E20;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 9999;
            pointer-events: none;
            white-space: nowrap;
        }
        #praisePopup.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        .loader {
            border: 4px solid #f3f3f3; border-top: 4px solid #D4AF37;
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

    <!-- شاشة البداية وإدخال المفتاح -->
    <div id="startScreen" class="w-full max-w-md bg-white rounded-3xl p-8 text-center shadow-2xl border-4 border-[#D4AF37]">
        <div class="text-6xl mb-4">🤖🕌</div>
        <h1 class="text-3xl font-black text-[#1B5E20] mb-2">تحدي المواكب الذكي</h1>
        <p class="text-gray-500 font-bold mb-6 text-sm">لعبة لا نهائية.. الذكاء الاصطناعي يولد لك أسئلة جديدة في كل مرة!</p>
        
        <div class="mb-4 text-right">
            <label class="block text-xs font-bold text-gray-600 mb-1">أدخل مفتاح Groq API للبدء:</label>
            <input type="password" id="apiKeyInput" placeholder="gsk_..." class="w-full bg-gray-50 border border-gray-300 rounded-lg p-3 text-sm focus:outline-none focus:border-[#1B5E20]" dir="ltr">
        </div>

        <button onclick="startGame()" class="w-full bg-[#1B5E20] text-white font-bold py-4 rounded-xl shadow-lg hover:bg-green-800 transition text-lg border border-[#D4AF37]">
            ابدأ التحدي
        </button>
    </div>

    <!-- شاشة اللعب -->
    <div id="quizScreen" class="w-full max-w-md hidden flex-col">
        
        <!-- الشريط العلوي -->
        <div class="flex justify-between items-center bg-white p-3 rounded-2xl shadow-sm mb-4 border border-gray-100">
            <button onclick="location.reload()" class="text-red-500 font-bold text-sm"><i class="fa-solid fa-arrow-right"></i> خروج</button>
            <div class="text-center">
                <p class="text-[10px] text-gray-500 font-bold">المرحلة</p>
                <p id="stageDisplay" class="text-sm font-black text-[#1B5E20]">1</p>
            </div>
            <div class="text-center">
                <p class="text-[10px] text-gray-500 font-bold">النقاط</p>
                <p id="scoreDisplay" class="text-sm font-black text-[#D4AF37]">0</p>
            </div>
        </div>

        <!-- بطاقة السؤال -->
        <div id="questionCard" class="bg-white rounded-3xl p-6 shadow-xl border border-gray-100 fade-in min-h-[300px] flex flex-col justify-center">
            
            <!-- حالة التحميل -->
            <div id="loadingState">
                <div class="loader mb-4"></div>
                <p class="text-center text-gray-500 font-bold text-sm">جاري سؤال الذكاء الاصطناعي لتوليد سؤال جديد...</p>
            </div>

            <!-- محتوى السؤال -->
            <div id="questionContent" class="hidden">
                <h2 id="questionText" class="text-lg font-bold text-gray-800 text-center mb-6 leading-relaxed"></h2>
                <div id="optionsContainer" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <!-- رسالة التشجيع -->
    <div id="praisePopup">أحسنت!</div>

    <script>
        // رسائل التشجيع
        const praises = [
            "أحسنت!", "ممتاز!", "قوي جداً!", "شنو هذا الذكاء يا بطل!", 
            "ما شاء الله عليك!", "إجابة صحيحة!", "عظيم!", "استمر يا نجم!"
        ];

        let apiKey = "";
        let score = 0;
        let stage = 1;
        let questionsInStage = 0;
        let isAnswering = false;

        const startScreen = document.getElementById('startScreen');
        const quizScreen = document.getElementById('quizScreen');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const stageDisplay = document.getElementById('stageDisplay');
        const loadingState = document.getElementById('loadingState');
        const questionContent = document.getElementById('questionContent');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const praisePopup = document.getElementById('praisePopup');

        // استرجاع المفتاح إذا كان محفوظاً
        if(localStorage.getItem('groqKey')) {
            apiKeyInput.value = localStorage.getItem('groqKey');
        }

        function startGame() {
            apiKey = apiKeyInput.value.trim();
            if (!apiKey || !apiKey.startsWith('gsk_')) {
                alert('يرجى إدخال مفتاح Groq API صحيح يبدأ بـ gsk_');
                return;
            }
            localStorage.setItem('groqKey', apiKey); // حفظ المفتاح
            
            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            quizScreen.classList.add('flex');
            
            score = 0;
            stage = 1;
            questionsInStage = 0;
            scoreDisplay.innerText = score;
            stageDisplay.innerText = stage;
            
            fetchAIQuestion();
        }

        async function fetchAIQuestion() {
            loadingState.classList.remove('hidden');
            questionContent.classList.add('hidden');
            isAnswering = false;

            // نص التوجيه للذكاء الاصطناعي
            const prompt = `Generate a multiple-choice trivia question about Karbala, Imam Hussein, or Hussaini processions. 
            The language MUST be Arabic. 
            Provide 4 options. 
            Return ONLY a valid JSON object with this exact structure, without any markdown or extra text:
            {"question": "نص السؤال هنا", "options": ["خيار 1", "خيار 2", "خيار 3", "خيار 4"], "correct": 0}
            Note: 'correct' is the index (0, 1, 2, or 3) of the correct option.`;

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant", // الموديل المحدث
                        messages: [{ role: "user", content: prompt }],
                        temperature: 0.8,
                        response_format: { type: "json_object" }
                    })
                });

                if (!response.ok) {
                    throw new Error('تأكد من صحة المفتاح أو اتصالك بالإنترنت.');
                }

                const data = await response.json();
                const aiText = data.choices[0].message.content;
                
                // تنظيف النص من أي علامات إضافية قد يضعها الذكاء الاصطناعي
                const cleanJson = aiText.replace(/```json/g, '').replace(/```/g, '').trim();
                const qData = JSON.parse(cleanJson);

                displayQuestion(qData);

            } catch (error) {
                console.error("Error:", error);
                loadingState.innerHTML = `
                    <div class="text-center">
                        <i class="fa-solid fa-triangle-exclamation text-red-500 text-4xl mb-3"></i>
                        <p class="text-red-500 font-bold mb-2">فشل الاتصال بالذكاء الاصطناعي</p>
                        <p class="text-gray-500 text-xs mb-4">${error.message}</p>
                        <button onclick="fetchAIQuestion()" class="bg-gray-200 px-4 py-2 rounded-lg text-sm font-bold w-full">إعادة المحاولة</button>
                    </div>
                `;
            }
        }

        function displayQuestion(qData) {
            loadingState.classList.add('hidden');
            questionContent.classList.remove('hidden');
            questionContent.classList.remove('fade-in');
            void questionContent.offsetWidth; 
            questionContent.classList.add('fade-in');

            questionText.innerText = qData.question;
            optionsContainer.innerHTML = '';

            qData.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full text-right font-bold py-3 px-4 rounded-xl text-gray-700";
                btn.innerText = option;
                btn.onclick = () => checkAnswer(index, qData.correct, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, correctIndex, btnElement) {
            if (isAnswering) return;
            isAnswering = true;

            const allButtons = optionsContainer.querySelectorAll('button');
            allButtons.forEach(b => b.classList.add('disabled-btn'));

            if (selectedIndex === correctIndex) {
                btnElement.classList.remove('option-btn');
                btnElement.classList.add('correct');
                score++;
                scoreDisplay.innerText = score;
                showPraise();
            } else {
                btnElement.classList.remove('option-btn');
                btnElement.classList.add('wrong');
                allButtons[correctIndex].classList.remove('option-btn');
                allButtons[correctIndex].classList.add('correct');
            }

            // نظام المراحل (كل 5 أسئلة مرحلة جديدة)
            questionsInStage++;
            if (questionsInStage >= 5) {
                stage++;
                questionsInStage = 0;
                stageDisplay.innerText = stage;
                // يمكنك إضافة تأثير صوتي هنا أو رسالة تهنئة بالانتقال للمرحلة الجديدة
            }

            setTimeout(() => {
                fetchAIQuestion();
            }, 1500);
        }

        function showPraise() {
            const randomMsg = praises[Math.floor(Math.random() * praises.length)];
            praisePopup.innerText = randomMsg;
            praisePopup.classList.add('show');
            
            setTimeout(() => {
                praisePopup.classList.remove('show');
            }, 1000);
        }
    </script>
</body>
</html>
