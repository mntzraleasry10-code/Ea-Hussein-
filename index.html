<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Breaker - تكسير الطوب</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            user-select: none;
            touch-action: none;
        }
        
        canvas {
            display: block;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            backdrop-filter: blur(8px);
        }
        
        .hidden { display: none !important; }

        .btn {
            background: #10b981; /* أخضر نيون */
            color: #fff;
            padding: 15px 50px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 22px;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
            transition: all 0.2s;
            border: none;
        }
        .btn:active { transform: scale(0.95); box-shadow: 0 0 10px rgba(16, 185, 129, 0.8); }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <!-- شريط النقاط والحياة -->
    <div id="hud" class="absolute top-0 left-0 right-0 p-4 flex justify-between items-center text-white z-10 hidden">
        <div class="bg-black/40 px-4 py-2 rounded-xl text-lg font-bold border border-cyan-500/50 text-cyan-400">
            النقاط: <span id="scoreText">0</span>
        </div>
        <div class="bg-black/40 px-4 py-2 rounded-xl text-lg font-bold border border-red-500/50 text-red-400" id="livesContainer">
            ❤️❤️❤️
        </div>
    </div>

    <!-- شاشة البداية -->
    <div id="startScreen" class="overlay">
        <div class="text-7xl mb-4">🧱</div>
        <h1 class="text-4xl font-black text-white mb-2">تكسير الطوب</h1>
        <p class="text-gray-400 mb-8 text-center px-8">حرك المضرب بيدك لكسر جميع الطوب!</p>
        <button onclick="startGame()" class="btn">ابدأ اللعب</button>
    </div>

    <!-- شاشة النهاية -->
    <div id="gameOverScreen" class="overlay hidden">
        <div class="text-7xl mb-4">💥</div>
        <h1 class="text-4xl font-black text-red-500 mb-2">انتهت اللعبة!</h1>
        <p class="text-white text-xl mb-8">نقاطك النهائية: <span id="finalScore" class="text-cyan-400 font-black text-3xl">0</span></p>
        <button onclick="startGame()" class="btn">حاول مجدداً</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let score = 0;
        let lives = 3;
        let isPlaying = false;
        let animationId;
        
        // إعدادات اللعبة
        const paddleWidth = 100;
        const paddleHeight = 15;
        const ballRadius = 8;
        let gameSpeed = 5; // سرعة الكرة
        
        // الكائنات
        const paddle = {
            x: 0,
            y: 0,
            w: paddleWidth,
            h: paddleHeight,
            color: '#06b6d4'
        };

        const ball = {
            x: 0,
            y: 0,
            dx: 0,
            dy: 0,
            radius: ballRadius,
            color: '#ffffff'
        };

        let bricks = [];
        const brickRowCount = 6;
        const brickColumnCount = 6;
        const brickWidth = 50;
        const brickHeight = 20;
        const brickPadding = 10;
        const brickOffsetTop = 80;
        let brickOffsetLeft = 0;

        const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];

        // إعدادات الشاشة
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            // ضبط موضع المضرب والكرة عند تغيير الحجم
            if (paddle.x === 0) {
                paddle.x = (width - paddleWidth) / 2;
                paddle.y = height - paddleHeight - 30;
                resetBall();
            }
            
            // حساب عرض الطوب ليتناسب مع الشاشة
            brickOffsetLeft = (width - (brickColumnCount * (brickWidth + brickPadding))) / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // إعادة ضبط الكرة
        function resetBall() {
            ball.x = paddle.x + paddle.w / 2;
            ball.y = paddle.y - ballRadius - 2;
            ball.dx = gameSpeed * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = -gameSpeed;
        }

        // إنشاء الطوب
        function initBricks() {
            bricks = [];
            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    bricks[c][r] = { 
                        x: 0, 
                        y: 0, 
                        status: 1, 
                        color: colors[r % colors.length] 
                    };
                }
            }
        }

        // التحكم بالمضرب (لمس أو ماوس)
        function movePaddle(e) {
            if (!isPlaying) return;
            
            let clientX = e.clientX;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
            }
            
            paddle.x = clientX - (paddleWidth / 2);
            
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.w > width) paddle.x = width - paddle.w;
        }

        canvas.addEventListener('mousemove', movePaddle);
        canvas.addEventListener('touchmove', movePaddle, { passive: false });

        // بدء اللعبة
        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            
            score = 0;
            lives = 3;
            gameSpeed = 5;
            document.getElementById('scoreText').innerText = score;
            updateLivesDisplay();
            
            paddle.x = (width - paddleWidth) / 2;
            paddle.y = height - paddleHeight - 30;
            
            initBricks();
            resetBall();
            
            isPlaying = true;
            if(animationId) cancelAnimationFrame(animationId);
            gameLoop();
        }

        function updateLivesDisplay() {
            let hearts = '';
            for(let i=0; i<lives; i++) hearts += '❤️';
            for(let i=lives; i<3; i++) hearts += '🖤';
            document.getElementById('livesContainer').innerText = hearts;
        }

        // حلقة اللعب
        function gameLoop() {
            if (!isPlaying) return;
            update();
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        // فيزياء اللعبة والتصادم
        function update() {
            // حركة الكرة
            ball.x += ball.dx;
            ball.y += ball.dy;

            // التصادم مع الحواف الجانبية
            if (ball.x + ball.radius > width || ball.x - ball.radius < 0) {
                ball.dx = -ball.dx;
            }

            // التصادم مع السقف
            if (ball.y - ball.radius < 0) {
                ball.dy = -ball.dy;
            }

            // التصادم مع المضرب
            if (ball.y + ball.radius > paddle.y && 
                ball.x > paddle.x && 
                ball.x < paddle.x + paddle.w) {
                
                // تغيير زاوية الكرة بناء على مكان الاصطدام
                let hitPos = ball.x - (paddle.x + paddle.w / 2);
                hitPos = hitPos / (paddle.w / 2); // قيمة بين -1 و 1
                
                let angle = hitPos * (Math.PI / 3); // زاوية أقصاها 60 درجة
                ball.dx = gameSpeed * Math.sin(angle);
                ball.dy = -gameSpeed * Math.cos(angle);
            }

            // التصادم مع الطوب
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    let b = bricks[c][r];
                    if (b.status === 1) {
                        if (ball.x > b.x && 
                            ball.x < b.x + brickWidth && 
                            ball.y > b.y && 
                            ball.y < b.y + brickHeight) {
                            
                            ball.dy = -ball.dy;
                            b.status = 0;
                            score++;
                            document.getElementById('scoreText').innerText = score;
                            
                            // زيادة السرعة قليلاً مع كل طوبة
                            gameSpeed += 0.05;
                            
                            // التحقق من الفوز
                            if (score === brickRowCount * brickColumnCount) {
                                winGame();
                            }
                        }
                    }
                }
            }

            // سقوط الكرة (خسارة حياة)
            if (ball.y + ball.radius > height) {
                lives--;
                updateLivesDisplay();
                
                if (lives <= 0) {
                    gameOver();
                } else {
                    // إعادة ضبط الكرة للبدء من جديد
                    resetBall();
                }
            }
        }

        // رسم العناصر
        function draw() {
            ctx.clearRect(0, 0, width, height);

            // رسم الطوب
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    if (bricks[c][r].status === 1) {
                        let b = bricks[c][r];
                        b.x = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
                        b.y = (r * (brickHeight + brickPadding)) + brickOffsetTop;
                        
                        ctx.fillStyle = b.color;
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = b.color;
                        ctx.beginPath();
                        ctx.roundRect(b.x, b.y, brickWidth, brickHeight, 5);
                        ctx.fill();
                    }
                }
            }

            // رسم المضرب
            ctx.fillStyle = paddle.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = paddle.color;
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 10);
            ctx.fill();

            // رسم الكرة
            ctx.fillStyle = ball.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffffff';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // إعادة ضبط الظل
            ctx.shadowBlur = 0;
        }

        function gameOver() {
            isPlaying = false;
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        function winGame() {
            isPlaying = false;
            alert('مبروك! لقد كسرت جميع الطوب!');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

    </script>
</body>
</html>
