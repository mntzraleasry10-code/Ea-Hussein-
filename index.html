<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>لعبة مواكب كربلاء</title>
    
    <!-- Tailwind CSS & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #F4F7F6;
            overflow: hidden;
            touch-action: manipulation; /* لمنع التكبير بالخطأ */
        }

        /* إعدادات بطاقات اللعبة */
        .card-container {
            perspective: 1000px;
            aspect-ratio: 1 / 1;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card-front {
            background: linear-gradient(135deg, #8B1A1A, #5E0B0B);
            border: 2px solid #D4AF37;
            font-size: 2rem;
            color: #D4AF37;
        }

        .card-back {
            background: white;
            border: 2px solid #8B1A1A;
            transform: rotateY(180deg);
            font-size: 3rem;
        }

        /* تأثير النجاح */
        .card.matched .card-back {
            background-color: #E8F5E9;
            border-color: #4CAF50;
            animation: bounce 0.5s;
        }

        @keyframes bounce {
            0%, 100% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.1); }
        }
    </style>
</head>
<body class="h-[100dvh] flex flex-col items-center justify-center p-4">

    <!-- شريط المعلومات -->
    <div class="w-full max-w-md flex justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
        <div class="text-center">
            <p class="text-xs text-gray-500 font-bold">المحاولات</p>
            <p id="movesCount" class="text-xl font-black text-[#8B1A1A]">0</p>
        </div>
        <h1 class="text-xl font-black text-[#8B1A1A] text-center leading-tight">لعبة<br><span class="text-sm">مواكب كربلاء</span></h1>
        <button onclick="startGame()" class="bg-[#D4AF37] text-[#5E0B0B] px-4 py-2 rounded-xl font-bold text-sm shadow hover:bg-yellow-500 transition">إعادة</button>
    </div>

    <!-- لوحة اللعب -->
    <div id="gameBoard" class="grid grid-cols-4 gap-3 w-full max-w-md">
        <!-- سيتم توليد البطاقات هنا بواسطة الجافاسكريبت -->
    </div>

    <!-- شاشة الفوز -->
    <div id="winScreen" class="fixed inset-0 bg-black/80 z-50 hidden flex-col items-center justify-center p-6 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-8 text-center shadow-2xl max-w-xs w-full border-4 border-[#D4AF37]">
            <div class="text-6xl mb-4">🏆</div>
            <h2 class="text-3xl font-black text-[#8B1A1A] mb-2">أحسنت!</h2>
            <p class="text-gray-600 font-bold mb-6">لقد أكملت اللعبة في <span id="finalMoves" class="text-[#8B1A1A] text-xl">0</span> محاولة.</p>
            <button onclick="startGame()" class="w-full bg-[#8B1A1A] text-white font-bold py-3 rounded-xl shadow-lg border-2 border-[#D4AF37]">العب مرة أخرى</button>
        </div>
    </div>

    <script>
        // الرموز التعبيرية المستخدمة في اللعبة
        const icons = ['🕌', '💧', '🍲', '🛏️', '🩺', '🤲', '📖', '⭐'];
        
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let lockBoard = false;

        const board = document.getElementById('gameBoard');
        const movesCount = document.getElementById('movesCount');
        const winScreen = document.getElementById('winScreen');
        const finalMoves = document.getElementById('finalMoves');

        // دالة خلط المصفوفة (Fisher-Yates)
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // بدء أو إعادة تشغيل اللعبة
        function startGame() {
            board.innerHTML = '';
            winScreen.classList.add('hidden');
            winScreen.classList.remove('flex');
            
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            lockBoard = false;
            movesCount.innerText = moves;

            // إنشاء بطاقات مزدوجة (كل أيقونة مرتين)
            cards = [...icons, ...icons];
            shuffle(cards);

            // رسم البطاقات في الصفحة
            cards.forEach((icon, index) => {
                const cardContainer = document.createElement('div');
                cardContainer.className = 'card-container';
                
                cardContainer.innerHTML = `
                    <div class="card" data-icon="${icon}" data-index="${index}" onclick="flipCard(this)">
                        <div class="card-face card-front">❓</div>
                        <div class="card-face card-back">${icon}</div>
                    </div>
                `;
                board.appendChild(cardContainer);
            });
        }

        // دالة قلب البطاقة
        function flipCard(card) {
            if (lockBoard) return;
            if (card.classList.contains('flipped')) return;

            // قلب البطاقة
            card.classList.add('flipped');
            flippedCards.push(card);

            // إذا تم قلب بطاقتين
            if (flippedCards.length === 2) {
                moves++;
                movesCount.innerText = moves;
                checkMatch();
            }
        }

        // التحقق من التطابق
        function checkMatch() {
            const card1 = flippedCards[0];
            const card2 = flippedCards[1];
            const isMatch = card1.dataset.icon === card2.dataset.icon;

            if (isMatch) {
                // إذا تطابقت البطاقات
                card1.classList.add('matched');
                card2.classList.add('matched');
                card1.style.pointerEvents = 'none';
                card2.style.pointerEvents = 'none';
                
                matchedPairs++;
                flippedCards = [];

                // التحقق من الفوز
                if (matchedPairs === icons.length) {
                    setTimeout(showWin, 600);
                }
            } else {
                // إذا لم تتطابق
                lockBoard = true;
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    lockBoard = false;
                }, 1000); // الانتظار ثانية قبل إعادة القلب
            }
        }

        // إظهار شاشة الفوز
        function showWin() {
            finalMoves.innerText = moves;
            winScreen.classList.remove('hidden');
            winScreen.classList.add('flex');
        }

        // تشغيل اللعبة عند فتح الصفحة
        window.onload = startGame;
    </script>
</body>
</html>
