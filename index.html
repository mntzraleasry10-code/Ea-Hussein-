<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مسابقة كربلاء الحسينية</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #111827, #1B5E20);
            height: 100dvh;
            overflow: hidden;
            user-select: none;
        }
        
        /* تأثيرات دخول العناصر */
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* تنسيق أزرار الإجابات */
        .option-btn {
            transition: all 0.2s ease;
            border: 2px solid #e5e7eb;
            background-color: white;
        }
        .option-btn:active { transform: scale(0.97); }
        .option-btn:hover { background-color: #f3f4f6; }

        /* حالات الأزرار */
        .correct { background-color: #10B981 !important; color: white !important; border-color: #10B981 !important; }
        .wrong { background-color: #EF4444 !important; color: white !important; border-color: #EF4444 !important; }
        .disabled-btn { pointer-events: none; opacity: 0.7; }

        /* شريط الوقت */
        #timerBar {
            transition: width 1s linear;
            height: 100%;
            background-color: #D4AF37;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

    <!-- شاشة البداية -->
    <div id="startScreen" class="w-full max-w-md bg-white rounded-3xl p-8 text-center shadow-2xl border-4 border-[#D4AF37]">
        <div class="text-6xl mb-4">🕌</div>
        <h1 class="text-3xl font-black text-[#1B5E20] mb-2">مسابقة كربلاء</h1>
        <p class="text-gray-500 font-bold mb-6 text-sm leading-relaxed">اختبر معلوماتك الحسينية وأجب على 10 أسئلة عشوائية قبل انتهاء الوقت!</p>
        <button onclick="startGame()" class="w-full bg-[#1B5E20] text-white font-bold py-4 rounded-xl shadow-lg hover:bg-green-800 transition text-lg border border-[#D4AF37]">
            ابدأ التحدي
        </button>
    </div>

    <!-- شاشة اللعب -->
    <div id="quizScreen" class="w-full max-w-md hidden">
        
        <!-- الشريط العلوي (النقاط والوقت) -->
        <div class="flex justify-between items-center bg-white p-3 rounded-2xl shadow-sm mb-4 border border-gray-100">
            <div class="text-center px-2">
                <p class="text-[10px] text-gray-500 font-bold">السؤال</p>
                <p id="questionCounter" class="text-sm font-black text-[#1B5E20]">1 / 10</p>
            </div>
            
            <!-- شريط الوقت -->
            <div class="flex-1 mx-2 h-2 bg-gray-200 rounded-full overflow-hidden">
                <div id="timerBar" class="w-full"></div>
            </div>

            <div class="text-center px-2">
                <p class="text-[10px] text-gray-500 font-bold">النقاط</p>
                <p id="scoreDisplay" class="text-sm font-black text-[#D4AF37]">0</p>
            </div>
        </div>

        <!-- بطاقة السؤال -->
        <div id="questionCard" class="bg-white rounded-3xl p-6 shadow-xl border border-gray-100 fade-in min-h-[300px] flex flex-col justify-between">
            <h2 id="questionText" class="text-lg font-bold text-gray-800 text-center mb-6 leading-relaxed"></h2>
            <div id="optionsContainer" class="space-y-3">
                <!-- سيتم توليد الأزرار هنا -->
            </div>
        </div>
    </div>

    <!-- شاشة النتيجة -->
    <div id="resultScreen" class="w-full max-w-md hidden bg-white rounded-3xl p-8 text-center shadow-2xl border-4 border-[#D4AF37]">
        <div class="text-6xl mb-4" id="resultEmoji">🏆</div>
        <h1 class="text-3xl font-black text-[#1B5E20] mb-2" id="resultTitle">عمل رائع!</h1>
        <p class="text-gray-600 font-bold mb-2">لقد أجبت بشكل صحيح على</p>
        <p class="text-4xl font-black text-[#D4AF37] mb-6"><span id="finalScore">0</span> / 10</p>
        
        <button onclick="startGame()" class="w-full bg-[#1B5E20] text-white font-bold py-4 rounded-xl shadow-lg hover:bg-green-800 transition text-lg">
            لعب مرة أخرى
        </button>
    </div>

    <script>
        // بنك الأسئلة (15 سؤالاً دينياً وثقافياً)
        const allQuestions = [
            { q: "في أي يوم استشهد الإمام الحسين (عليه السلام)؟", o: ["10 محرم (عاشوراء)", "1 محرم", "15 شعبان", "1 رمضان"], a: 0 },
            { q: "ما هو اللقب الذي يُعرف به أبو الفضل العباس (عليه السلام)؟", o: ["سيف الله", "قمر بني هاشم", "زين العابدين", "أبو تراب"], a: 1 },
            { q: "في أي مدينة وقعت معركة الطف؟", o: ["النجف الأشرف", "الكوفة", "كربلاء المقدسة", "سامراء"], a: 2 },
            { q: "ما هي العبارة الشهيرة التي قالها الإمام الحسين يوم عاشوراء؟", o: ["الصبر جميل", "لا حول ولا قوة إلا بالله", "هيهات منا الذلة", "حسبنا الله"], a: 2 },
            { q: "من هي السيدة التي قادت سبايا كربلاء ورعت السيدة زين العابدين؟", o: ["السيدة رقية", "السيدة زينب", "السيدة أم البنين", "السيدة فاطمة الزهراء"], a: 1 },
            { q: "من هو قائد جيش يزيد بن معاوية في معركة الطف؟", o: ["الشمر بن ذي الجوشن", "عمر بن سعد", "عبيد الله بن زياد", "الحصين بن نمير"], a: 1 },
            { q: "كم كان عمر الإمام الحسين (ع) عند استشهاده؟", o: ["50 عاماً", "57 عاماً", "63 عاماً", "45 عاماً"], a: 1 },
            { q: "ما اسم النهر الذي استشهد الإمام الحسين وهو عطشان قربه؟", o: ["نهر الفرات", "نهر دجلة", "نهر النيل", "نهر الكوفة"], a: 0 },
            { q: "من هو الصحابي الذي دفن الإمام الحسين (ع)؟", o: ["جابر بن عبد الله الأنصاري", "بنو أسد", "الإمام السجاد", "أبو ذر الغفاري"], a: 1 },
            { q: "أي من هذه الأسماء هو اسم زوجة الإمام الحسين (ع) وأم علي الأكبر؟", o: ["ليلى بنت أبي مرة", "شهربانو", "أم إسحاق", "لبابة"], a: 0 },
            { q: "في أي عام هجري وقعت معركة الطف؟", o: ["السنة 60 للهجرة", "السنة 61 للهجرة", "السنة 62 للهجرة", "السنة 50 للهجرة"], a: 1 },
            { q: "من هو الشخص الذي خان الإمام الحسين (ع) في الكوفة وخرج لقتاله؟", o: ["الحر بن يزيد الرياحي", "الحسين بن علي", "المختار الثقفي", "الشمر بن ذي الجوشن"], a: 3 },
            { q: "ما هو لقب الإمام الحسين (ع)؟", o: ["أبو الشهداء", "سيد الشهداء", "سيف الإسلام", "ذو الفقار"], a: 1 },
            { q: "من هو أول شهيد في معركة الطف؟", o: ["علي الأكبر", "مسلم بن عقيل", "عبد الله الرضيع", "علي الأصغر"], a: 0 },
            { q: "بأي شيء طلب الإمام الحسين من جيش العدو أن يسمحوا له؟", o: ["بالماء", "بالخروج من العراق", "بالرجوع إلى مكة", "بالتوجه لليزيد"], a: 2 }
        ];

        let questions = [];
        let currentIndex = 0;
        let score = 0;
        let timer;
        let timeLeft = 15; // 15 ثانية لكل سؤال
        const maxQuestions = 10;

        const startScreen = document.getElementById('startScreen');
        const quizScreen = document.getElementById('quizScreen');
        const resultScreen = document.getElementById('resultScreen');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const questionCounter = document.getElementById('questionCounter');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const finalScore = document.getElementById('finalScore');
        const timerBar = document.getElementById('timerBar');

        // خلط المصفوفة
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startGame() {
            // خلط الأسئلة واختيار 10 فقط
            questions = shuffleArray([...allQuestions]).slice(0, maxQuestions);
            currentIndex = 0;
            score = 0;
            scoreDisplay.innerText = score;

            startScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            
            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(timer);
            if (currentIndex >= questions.length) {
                endGame();
                return;
            }

            const currentQ = questions[currentIndex];
            
            // تحديث العداد
            questionCounter.innerText = `${currentIndex + 1} / ${maxQuestions}`;
            
            // تأثير الدخول
            const card = document.getElementById('questionCard');
            card.classList.remove('fade-in');
            void card.offsetWidth; 
            card.classList.add('fade-in');

            questionText.innerText = currentQ.q;
            optionsContainer.innerHTML = '';

            // إنشاء الخيارات
            currentQ.o.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full text-right font-bold py-3 px-4 rounded-xl text-gray-700";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, currentQ.a, btn);
                optionsContainer.appendChild(btn);
            });

            // بدء المؤقت
            timeLeft = 15;
            timerBar.style.width = '100%';
            timerBar.style.backgroundColor = '#D4AF37';
            
            // تحديث شريط الوقت كل ثانية
            timer = setInterval(() => {
                timeLeft -= 1;
                timerBar.style.width = `${(timeLeft / 15) * 100}%`;
                
                if (timeLeft <= 5) timerBar.style.backgroundColor = '#EF4444'; // يصبح أحمر
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    timeOut();
                }
            }, 1000);
        }

        function checkAnswer(selected, correct, btn) {
            clearInterval(timer);
            const allBtns = optionsContainer.querySelectorAll('button');
            allBtns.forEach(b => b.classList.add('disabled-btn'));

            if (selected === correct) {
                btn.classList.remove('option-btn');
                btn.classList.add('correct');
                score++;
                scoreDisplay.innerText = score;
            } else {
                btn.classList.remove('option-btn');
                btn.classList.add('wrong');
                allBtns[correct].classList.remove('option-btn');
                allBtns[correct].classList.add('correct');
            }

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 1200); // الانتقال بعد ثانية
        }

        function timeOut() {
            const currentQ = questions[currentIndex];
            const allBtns = optionsContainer.querySelectorAll('button');
            allBtns.forEach(b => b.classList.add('disabled-btn'));
            
            allBtns[currentQ.a].classList.remove('option-btn');
            allBtns[currentQ.a].classList.add('correct');

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 1200);
        }

        function endGame() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            finalScore.innerText = score;

            const emoji = document.getElementById('resultEmoji');
            const title = document.getElementById('resultTitle');

            if (score === 10) {
                emoji.innerText = "👑";
                title.innerText = "أنت خبير كربلاء!";
            } else if (score >= 7) {
                emoji.innerText = "🏆";
                title.innerText = "معلوماتك ممتازة!";
            } else if (score >= 4) {
                emoji.innerText = "🌟";
                title.innerText = "جيد، يمكنك التحسن!";
            } else {
                emoji.innerText = "📚";
                title.innerText = "تحتاج لقراءة المزيد!";
            }
        }
    </script>
</body>
</html>
