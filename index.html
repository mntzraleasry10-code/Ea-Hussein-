<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 مشغل أفلامي</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: #0f1115;
    color: #fff;
    padding: 20px;
  }
  header {
    text-align: center;
    font-size: 26px;
    margin-bottom: 20px;
    color: #ffcc00;
  }
  main { max-width: 900px; margin: auto; }
  #dropZone {
    border: 2px dashed #555;
    border-radius: 12px;
    padding: 30px;
    text-align: center;
    color: #aaa;
    cursor: pointer;
    margin-bottom: 15px;
    transition: 0.2s;
  }
  #dropZone.hover {
    border-color: #ffcc00;
    background: #1a1d24;
    color: #fff;
  }
  input[type="file"] { display: none; }
  video {
    width: 100%;
    max-height: 500px;
    background: #000;
    border-radius: 12px;
    margin-bottom: 15px;
  }
  h3 { color: #ffcc00; }
  ul { list-style: none; padding: 0; }
  li {
    background: #1a1d24;
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
  }
  li:hover { background: #2a2f3a; }
  li.active { background: #ffcc00; color: #000; font-weight: bold; }
</style>
</head>
<body>
<header>🎬 مشغل أفلامي</header>
<main>
  <div id="dropZone">اسحب الأفلام هنا أو اضغط لاختيار ملفات</div>
  <input type="file" id="fileInput" accept="video/*" multiple>

  <video id="player" controls></video>

  <h3>قائمة الأفلام</h3>
  <ul id="playlist"></ul>
</main>

<script>
  const fileInput = document.getElementById('fileInput');
  const dropZone = document.getElementById('dropZone');
  const player = document.getElementById('player');
  const playlist = document.getElementById('playlist');
  const urls = [];

  dropZone.addEventListener('click', () => fileInput.click());

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('hover');
  });

  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('hover');
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('hover');
    addFiles(e.dataTransfer.files);
  });

  fileInput.addEventListener('change', (e) => {
    addFiles(e.target.files);
  });

  function addFiles(files) {
    const videos = [...files].filter(f => f.type.startsWith('video/'));

    videos.forEach(file => {
      const url = URL.createObjectURL(file);
      urls.push(url);

      const li = document.createElement('li');
      li.textContent = '🎞️ ' + file.name;

      li.addEventListener('click', () => {
        player.src = url;
        player.play();

        document.querySelectorAll('li').forEach(x => x.classList.remove('active'));
        li.classList.add('active');
      });

      playlist.appendChild(li);

      if (!player.src) {
        player.src = url;
        li.classList.add('active');
      }
    });
  }

  window.addEventListener('beforeunload', () => {
    urls.forEach(url => URL.revokeObjectURL(url));
  });
</script>
</body>
</html>
