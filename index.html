<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مسابقة كربلاء الذكية</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #111827, #1B5E20);
            height: 100dvh;
            overflow: hidden;
        }
        
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .option-btn { transition: all 0.3s ease; }
        .option-btn:active { transform: scale(0.98); }

        .correct { background-color: #4CAF50 !important; color: white !important; border-color: #4CAF50 !important; }
        .wrong { background-color: #F44336 !important; color: white !important; border-color: #F44336 !important; }

        .loader {
            border: 4px solid #f3f3f3; border-top: 4px solid #D4AF37;
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

    <div id="startScreen" class="w-full max-w-md bg-white rounded-3xl p-8 text-center shadow-2xl border-4 border-[#D4AF37]">
        <div class="text-6xl mb-4">🤖🕌</div>
        <h1 class="text-3xl font-black text-[#1B5E20] mb-2">مسابقة كربلاء الذكية</h1>
        <p class="text-gray-500 font-bold mb-6 text-sm">أسئلة لا تنتهي يتم توليدها بواسطة الذكاء الاصطناعي!</p>
        
        <div class="mb-4 text-right">
            <label class="block text-xs font-bold text-gray-600 mb-1">أدخل مفتاح Groq API الجديد:</label>
            <input type="password" id="apiKeyInput" placeholder="gsk_..." class="w-full bg-gray-50 border border-gray-300 rounded-lg p-3 text-sm focus:outline-none focus:border-[#1B5E20]">
        </div>

        <button onclick="startGame()" class="w-full bg-[#1B5E20] text-white font-bold py-4 rounded-xl shadow-lg hover:bg-green-800 transition text-lg border border-[#D4AF37]">ابدأ اللعب الآن</button>
    </div>

    <div id="quizScreen" class="w-full max-w-md hidden">
        <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm mb-4 border border-gray-100">
            <div class="text-center">
                <p class="text-xs text-gray-500 font-bold">النقاط</p>
                <p id="scoreDisplay" class="text-lg font-black text-[#D4AF37]">0</p>
            </div>
            <div class="text-center text-[#1B5E20] font-black text-sm">
                <i class="fa-solid fa-brain mr-1"></i> AI Quiz
            </div>
            <button onclick="location.reload()" class="text-red-500 text-sm font-bold"><i class="fa-solid fa-arrow-right-from-bracket"></i> خروج</button>
        </div>

        <div id="questionCard" class="bg-white rounded-3xl p-6 shadow-xl border border-gray-100 mb-6 fade-in min-h-[250px] flex flex-col justify-center">
            <div id="loadingState">
                <div class="loader mb-4"></div>
                <p class="text-center text-gray-500 font-bold text-sm">جاري توليد سؤال جديد...</p>
            </div>

            <div id="questionContent" class="hidden">
                <h2 id="questionText" class="text-xl font-bold text-gray-800 text-center mb-6 leading-relaxed"></h2>
                <div id="optionsContainer" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        let currentScore = 0;
        let isAnswering = false;
        let apiKey = "";

        const startScreen = document.getElementById('startScreen');
        const quizScreen = document.getElementById('quizScreen');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const loadingState = document.getElementById('loadingState');
        const questionContent = document.getElementById('questionContent');
        const apiKeyInput = document.getElementById('apiKeyInput');

        if(localStorage.getItem('groqKey')) {
            apiKeyInput.value = localStorage.getItem('groqKey');
        }

        function startGame() {
            apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                alert('يرجى إدخال مفتاح API أولاً!');
                return;
            }
            localStorage.setItem('groqKey', apiKey);
            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            currentScore = 0;
            scoreDisplay.innerText = currentScore;
            fetchAIQuestion();
        }

        async function fetchAIQuestion() {
            loadingState.classList.remove('hidden');
            questionContent.classList.add('hidden');
            isAnswering = false;

            const prompt = `Generate a multiple-choice trivia question about Karbala, Imam Hussein, or Hussaini processions. 
            The language MUST be Arabic. 
            Provide 3 options. 
            Return ONLY a valid JSON object with this exact structure:
            {"question": "السؤال هنا", "options": ["خيار 1", "خيار 2", "خيار 3"], "correct": 0}`;

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant", // تحديث اسم الموديل هنا
                        messages: [{ role: "user", content: prompt }],
                        temperature: 0.7,
                        response_format: { type: "json_object" }
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || 'تأكد من المفتاح');
                }

                const data = await response.json();
                const aiText = data.choices[0].message.content;
                const qData = JSON.parse(aiText);
                displayQuestion(qData);

            } catch (error) {
                // هذا السطر سيطبع الخطأ الحقيقي في الكونسول لمساعدتنا
                console.error("الخطأ الحقيقي:", error); 
                
                loadingState.innerHTML = `
                    <p class="text-red-500 text-center font-bold mb-2">حدث خطأ!</p>
                    <p class="text-gray-500 text-center text-xs mb-4">${error.message}</p>
                    <button onclick="fetchAIQuestion()" class="bg-gray-200 px-4 py-2 rounded-lg text-sm font-bold w-full">إعادة المحاولة</button>
                `;
            }
        }

        function displayQuestion(qData) {
            loadingState.classList.add('hidden');
            questionContent.classList.remove('hidden');
            
            questionText.innerText = qData.question;
            optionsContainer.innerHTML = '';

            qData.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full text-right bg-gray-50 border-2 border-gray-200 text-gray-700 font-bold py-3 px-4 rounded-xl hover:bg-gray-100";
                btn.innerText = option;
                btn.onclick = () => checkAnswer(index, qData.correct, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, correctIndex, btnElement) {
            if (isAnswering) return;
            isAnswering = true;

            const allButtons = optionsContainer.querySelectorAll('button');

            if (selectedIndex === correctIndex) {
                btnElement.classList.remove('bg-gray-50', 'border-gray-200', 'text-gray-700');
                btnElement.classList.add('correct');
                currentScore++;
                scoreDisplay.innerText = currentScore;
            } else {
                btnElement.classList.remove('bg-gray-50', 'border-gray-200', 'text-gray-700');
                btnElement.classList.add('wrong');
                allButtons[correctIndex].classList.remove('bg-gray-50', 'border-gray-200', 'text-gray-700');
                allButtons[correctIndex].classList.add('correct');
            }

            setTimeout(() => {
                fetchAIQuestion();
            }, 1500);
        }
    </script>
</body>
</html>
