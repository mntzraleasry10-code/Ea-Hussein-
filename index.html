<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة تركيب الصور - 50 مرحلة</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
  }
  .game {
    background: rgba(255,255,255,0.95);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    text-align: center;
    max-width: 700px;
    width: 100%;
  }
  h1 { margin: 0 0 15px; color: #333; font-size: 1.8rem; }
  .controls {
    display: flex; justify-content: center; align-items: center;
    gap: 10px; margin-bottom: 15px; flex-wrap: wrap;
  }
  select {
    padding: 8px 12px; border-radius: 10px; border: 2px solid #764ba2;
    font-size: 1rem; background: #fff; color: #333; cursor: pointer;
  }
  #difficultyLabel {
    font-weight: bold; color: #764ba2; background: #f0e6ff;
    padding: 4px 12px; border-radius: 20px;
  }
  .board-wrapper { display: flex; justify-content: center; margin: 10px 0; }
  .board {
    display: grid;
    border: 4px solid #764ba2;
    border-radius: 10px;
    overflow: hidden;
    background: #ddd;
    max-width: 90vw;
    max-height: 90vw;
    aspect-ratio: 1;
    margin: 0 auto;
  }
  .piece {
    background-repeat: no-repeat;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    border: 1px solid rgba(255,255,255,0.4);
    background-color: #fff;
  }
  .piece:hover { transform: scale(0.98); }
  .piece.selected {
    outline: 4px solid #ffcc00;
    outline-offset: -4px;
    z-index: 2;
    transform: scale(1.02);
    box-shadow: 0 0 15px #ffcc00;
  }
  .buttons {
    display: flex; justify-content: center; gap: 10px;
    flex-wrap: wrap; margin-top: 15px;
  }
  button {
    padding: 10px 20px; border: none; border-radius: 12px;
    font-size: 1rem; font-weight: bold; cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    background: #764ba2; color: white; box-shadow: 0 4px 0 #5a3780;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #5a3780; }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 #5a3780; }
  .message {
    margin-top: 15px; padding: 20px; background: #d4edda;
    border-radius: 15px; border: 2px solid #28a745;
  }
  .message p { font-size: 1.5rem; margin: 0 0 10px; color: #155724; }
  .hidden { display: none !important; }
  .hint-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7); display: flex;
    justify-content: center; align-items: center;
    z-index: 100; cursor: pointer;
  }
  .hint-overlay img {
    max-width: 80vw; max-height: 80vh; border-radius: 15px;
    border: 5px solid white; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
  <div class="game">
    <h1>🧩 لعبة تركيب الصور</h1>
    <div class="controls">
      <label>المرحلة: <select id="levelSelect"></select></label>
      <span id="difficultyLabel"></span>
    </div>
    <div class="board-wrapper">
      <div id="board" class="board"></div>
    </div>
    <div class="buttons">
      <button id="shuffleBtn">🔀 خلط</button>
      <button id="hintBtn">👁️ تلميح</button>
      <button id="resetBtn">🔄 إعادة</button>
    </div>
    <div id="message" class="message hidden">
      <p>🎉 أحسنت! أكملت المرحلة</p>
      <button id="nextBtn">المرحلة التالية ➡️</button>
    </div>
  </div>

  <div id="hintOverlay" class="hint-overlay hidden">
    <img id="hintImg" src="" alt="تلميح">
  </div>

<script>
  // 50 شخصية (إيموجي) — تكدر تبدل الإيموجي بصور حقيقية لاحقاً
  const characters = [
    { emoji: '🦸‍♂️', name: 'سوبرمان' },
    { emoji: '🦸‍♀️', name: 'وندر وومان' },
    { emoji: '🧙‍♂️', name: 'ساحر' },
    { emoji: '🧚‍♀️', name: 'جنية' },
    { emoji: '🧜‍♀️', name: 'حورية البحر' },
    { emoji: '🧛‍♂️', name: 'دراكولا' },
    { emoji: '🧟‍♂️', name: 'زومبي' },
    { emoji: '🤖', name: 'روبوت' },
    { emoji: '👽', name: 'فضائي' },
    { emoji: '🐉', name: 'تنين' },
    { emoji: '🦄', name: 'وحيد القرن' },
    { emoji: '🐭', name: 'ميكي ماوس' },
    { emoji: '🐻', name: 'دبدوب' },
    { emoji: '🦊', name: 'ثعلب' },
    { emoji: '🐯', name: 'نمر' },
    { emoji: '🦁', name: 'أسد' },
    { emoji: '🐸', name: 'ضفدع' },
    { emoji: '🐵', name: 'قرد' },
    { emoji: '🐼', name: 'باندا' },
    { emoji: '🐨', name: 'كوالا' },
    { emoji: '🐧', name: 'بطريق' },
    { emoji: '🦉', name: 'بومة' },
    { emoji: '🐙', name: 'أخطبوط' },
    { emoji: '🦖', name: 'ديناصور' },
    { emoji: '🐝', name: 'نحلة' },
    { emoji: '🦋', name: 'فراشة' },
    { emoji: '🐞', name: 'دعسوقة' },
    { emoji: '🐢', name: 'سلحفاة' },
    { emoji: '🐰', name: 'أرنب' },
    { emoji: '🐮', name: 'بقرة' },
    { emoji: '🐷', name: 'خنزير' },
    { emoji: '🐔', name: 'دجاجة' },
    { emoji: '🐺', name: 'ذئب' },
    { emoji: '🦇', name: 'خفاش' },
    { emoji: '🦅', name: 'نسر' },
    { emoji: '🐬', name: 'دلفين' },
    { emoji: '🐳', name: 'حوت' },
    { emoji: '🦈', name: 'قرش' },
    { emoji: '🐊', name: 'تمساح' },
    { emoji: '🦒', name: 'زرافة' },
    { emoji: '🦓', name: 'حمار وحشي' },
    { emoji: '🐘', name: 'فيل' },
    { emoji: '🦔', name: 'قنفذ' },
    { emoji: '🐿️', name: 'سنجاب' },
    { emoji: '🦥', name: 'كسلان' },
    { emoji: '🦦', name: 'ثعلب الماء' },
    { emoji: '🦩', name: 'فلامنغو' },
    { emoji: '🦚', name: 'طاووس' },
    { emoji: '👑', name: 'ملك' },
    { emoji: '🎩', name: 'ساحر' }
  ];

  const boardEl = document.getElementById('board');
  const levelSelect = document.getElementById('levelSelect');
  const difficultyLabel = document.getElementById('difficultyLabel');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const hintBtn = document.getElementById('hintBtn');
  const resetBtn = document.getElementById('resetBtn');
  const messageEl = document.getElementById('message');
  const nextBtn = document.getElementById('nextBtn');
  const hintOverlay = document.getElementById('hintOverlay');
  const hintImg = document.getElementById('hintImg');

  let currentLevel = 1;
  let gridSize = 2;
  let pieces = [];
  let selectedIndex = null;
  let originalImageURL = '';
  let isSolved = false;

  function getGridSize(level) {
    if (level <= 5) return 2;
    if (level <= 15) return 3;
    if (level <= 30) return 4;
    if (level <= 40) return 5;
    return 6;
  }

  function getDifficultyText(level) {
    if (level <= 5) return 'سهل جداً';
    if (level <= 15) return 'سهل';
    if (level <= 30) return 'متوسط';
    if (level <= 40) return 'صعب';
    return 'صعب جداً';
  }

  function generateCharacterImage(emoji, level) {
    const canvas = document.createElement('canvas');
    canvas.width = 600;
    canvas.height = 600;
    const ctx = canvas.getContext('2d');

    const hue1 = (level * 37) % 360;
    const hue2 = (hue1 + 60) % 360;
    const grad = ctx.createLinearGradient(0, 0, 600, 600);
    grad.addColorStop(0, `hsl(${hue1}, 80%, 70%)`);
    grad.addColorStop(1, `hsl(${hue2}, 80%, 50%)`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 600, 600);

    ctx.globalAlpha = 0.2;
    for (let i = 0; i < 8; i++) {
      ctx.beginPath();
      ctx.arc(Math.random()*600, Math.random()*600, 40 + Math.random()*80, 0, Math.PI*2);
      ctx.fillStyle = '#fff';
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.font = '400px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 20;
    ctx.shadowOffsetX = 10;
    ctx.shadowOffsetY = 10;
    ctx.fillText(emoji, 300, 320);

    return canvas.toDataURL();
  }

  function initLevelSelect() {
    levelSelect.innerHTML = '';
    characters.forEach((ch, idx) => {
      const opt = document.createElement('option');
      opt.value = idx + 1;
      opt.textContent = `المرحلة ${idx + 1} - ${ch.name}`;
      levelSelect.appendChild(opt);
    });
  }

  function loadLevel(level) {
    currentLevel = level;
    gridSize = getGridSize(level);
    difficultyLabel.textContent = `(${getDifficultyText(level)})`;
    levelSelect.value = level;
    const char = characters[level - 1];
    originalImageURL = generateCharacterImage(char.emoji, level);
    isSolved = false;
    selectedIndex = null;
    messageEl.classList.add('hidden');
    hintOverlay.classList.add('hidden');

    const total = gridSize * gridSize;
    pieces = Array.from({ length: total }, (_, i) => i);
    shuffleArray(pieces);
    if (isSolvedArray(pieces)) shuffleArray(pieces);
    renderBoard();
  }

  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function isSolvedArray(arr) {
    return arr.every((val, idx) => val === idx);
  }

  function renderBoard() {
    const gameWidth = document.querySelector('.game').clientWidth;
    const boardSize = Math.min(gameWidth - 40, 600, window.innerWidth - 60);
    const pieceSize = boardSize / gridSize;
    boardEl.style.width = boardSize + 'px';
    boardEl.style.height = boardSize + 'px';
    boardEl.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
    boardEl.innerHTML = '';

    pieces.forEach((correctIdx, pos) => {
      const row = Math.floor(correctIdx / gridSize);
      const col = correctIdx % gridSize;
      const piece = document.createElement('div');
      piece.className = 'piece';
      if (selectedIndex === pos) piece.classList.add('selected');
      piece.style.width = pieceSize + 'px';
      piece.style.height = pieceSize + 'px';
      piece.style.backgroundImage = `url(${originalImageURL})`;
      piece.style.backgroundSize = `${boardSize}px ${boardSize}px`;
      piece.style.backgroundPosition = `-${col * pieceSize}px -${row * pieceSize}px`;
      piece.addEventListener('click', () => onPieceClick(pos));
      boardEl.appendChild(piece);
    });
  }

  function onPieceClick(pos) {
    if (isSolved) return;
    if (selectedIndex === null) {
      selectedIndex = pos;
      renderBoard();
    } else if (selectedIndex === pos) {
      selectedIndex = null;
      renderBoard();
    } else {
      [pieces[selectedIndex], pieces[pos]] = [pieces[pos], pieces[selectedIndex]];
      selectedIndex = null;
      renderBoard();
      checkWin();
    }
  }

  function checkWin() {
    if (isSolvedArray(pieces)) {
      isSolved = true;
      messageEl.classList.remove('hidden');
    }
  }

  function shuffleBoard() {
    if (isSolved) return;
    shuffleArray(pieces);
    if (isSolvedArray(pieces)) shuffleArray(pieces);
    selectedIndex = null;
    renderBoard();
  }

  function resetBoard() {
    loadLevel(currentLevel);
  }

  function showHint() {
    hintImg.src = originalImageURL;
    hintOverlay.classList.remove('hidden');
    setTimeout(() => hintOverlay.classList.add('hidden'), 2000);
  }

  levelSelect.addEventListener('change', (e) => loadLevel(parseInt(e.target.value)));
  shuffleBtn.addEventListener('click', shuffleBoard);
  hintBtn.addEventListener('click', showHint);
  resetBtn.addEventListener('click', resetBoard);
  nextBtn.addEventListener('click', () => {
    let next = currentLevel + 1;
    if (next > 50) next = 1;
    loadLevel(next);
  });
  hintOverlay.addEventListener('click', () => hintOverlay.classList.add('hidden'));

  initLevelSelect();
  loadLevel(1);

  window.addEventListener('resize', () => {
    if (!isSolved) renderBoard();
  });
</script>
</body>
</html>
