<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Jump - القفزة المضيئة</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #0f172a; /* أزرق داكن جداً (فضاء) */
            user-select: none;
            touch-action: none;
        }
        
        canvas {
            display: block;
            /* تأثير النجوم في الخلفية */
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50px 160px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            backdrop-filter: blur(8px);
        }
        
        .hidden { display: none !important; }

        .btn {
            background: #06b6d4; /* أزرق سماوي مضيء */
            color: #fff;
            padding: 15px 50px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 22px;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.6);
            transition: all 0.2s;
            border: none;
        }
        .btn:active { transform: scale(0.95); box-shadow: 0 0 10px rgba(6, 182, 212, 0.8); }

        /* تأثير توهج النص */
        .glow-text {
            text-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 20px rgba(6, 182, 212, 0.8);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <!-- شريط النقاط -->
    <div id="hud" class="absolute top-8 left-0 right-0 flex justify-center text-white z-10 hidden">
        <div class="text-4xl font-black glow-text text-[#06b6d4]">
            <span id="scoreText">0</span>
        </div>
    </div>

    <!-- شاشة البداية -->
    <div id="startScreen" class="overlay">
        <div class="text-8xl mb-6">🌌</div>
        <h1 class="text-5xl font-black text-white mb-4 glow-text">Neon Jump</h1>
        <p class="text-gray-300 mb-10 text-lg px-8 text-center">اسحب يميناً ويساراً للتحكم بالكرة، واقفز للأعلى!</p>
        <button onclick="startGame()" class="btn">ابدأ اللعب</button>
    </div>

    <!-- شاشة النهاية -->
    <div id="gameOverScreen" class="overlay hidden">
        <div class="text-8xl mb-4">💥</div>
        <h1 class="text-4xl font-black text-[#f43f5e] mb-2 glow-text">سقطت!</h1>
        <p class="text-white text-xl mb-8">أعلى نقطة وصلت لها: <span id="finalScore" class="text-[#06b6d4] font-black text-4xl">0</span></p>
        <button onclick="startGame()" class="btn">العب مرة أخرى</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let score = 0;
        let isPlaying = false;
        let animationId;
        
        // إعدادات الفيزياء
        const gravity = 0.4;
        const jumpForce = -11;
        
        // الكرة (اللاعب)
        const player = {
            x: 0,
            y: 0,
            radius: 15,
            vx: 0,
            vy: 0,
            color: '#06b6d4',
            isDragging: false
        };

        // المنصات
        let platforms = [];
        const platformWidth = 70;
        const platformHeight = 12;
        const platformGap = 90; // المسافة العمودية بين المنصات

        // إعدادات الشاشة
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // التحكم بالكرة (السحب)
        function handlePointerDown(e) {
            if (!isPlaying) return;
            player.isDragging = true;
            movePlayer(e);
        }
        
        function handlePointerMove(e) {
            if (!isPlaying || !player.isDragging) return;
            movePlayer(e);
        }
        
        function handlePointerUp() {
            player.isDragging = false;
            // إيقاف الحركة الأفقية ببطء
            player.vx *= 0.5; 
        }

        function movePlayer(e) {
            let clientX = e.clientX;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
            }
            
            // حساب سرعة الحركة بناء على المسافة من مركز الكرة
            const targetX = clientX;
            player.vx = (targetX - player.x) * 0.15;
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        canvas.addEventListener('mouseup', handlePointerUp);
        canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
        canvas.addEventListener('touchmove', handlePointerMove, { passive: false });
        canvas.addEventListener('touchend', handlePointerUp);

        // دالة إنشاء المنصات
        function initPlatforms() {
            platforms = [];
            // منصة البداية تحت اللاعب
            platforms.push({ x: width/2 - platformWidth/2, y: height - 100, color: '#d946ef' });
            
            // توليد المنصات الأولى
            for (let i = 1; i < 10; i++) {
                spawnPlatform(height - 100 - (i * platformGap));
            }
        }

        function spawnPlatform(yPos) {
            // توليد موضع عشوائي للمنصة
            const xPos = Math.random() * (width - platformWidth - 40) + 20;
            // اختيار لون عشوائي من ألوان النيون
            const colors = ['#d946ef', '#8b5cf6', '#06b6d4', '#10b981'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            
            platforms.push({ x: xPos, y: yPos, color: randomColor });
        }

        // بدء اللعبة
        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            
            score = 0;
            document.getElementById('scoreText').innerText = score;
            
            player.x = width / 2;
            player.y = height - 150;
            player.vx = 0;
            player.vy = jumpForce;
            
            initPlatforms();
            isPlaying = true;
            
            if(animationId) cancelAnimationFrame(animationId);
            gameLoop();
        }

        // حلقة اللعب
        function gameLoop() {
            if (!isPlaying) return;
            update();
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        function update() {
            // تحديث حركة اللاعب
            player.vy += gravity;
            player.x += player.vx;
            player.y += player.vy;

            // التصادم مع الحواف الجانبية (يلتف للجهة الأخرى)
            if (player.x < 0) player.x = width;
            if (player.x > width) player.x = 0;

            // فحص التصادم مع المنصات
            if (player.vy > 0) { // فقط إذا كان يسقط
                platforms.forEach(p => {
                    if (
                        player.x + player.radius > p.x &&
                        player.x - player.radius < p.x + platformWidth &&
                        player.y + player.radius > p.y &&
                        player.y - player.radius < p.y + platformHeight
                    ) {
                        player.vy = jumpForce;
                        // إضافة نقاط عند القفز على منصة جديدة
                        if (p.y < player.y + 50) { 
                            score++;
                            document.getElementById('scoreText').innerText = score;
                        }
                    }
                });
            }

            // الكاميرا (تحريك العالم للأسفل عندما يصعد اللاعب)
            if (player.y < height / 2) {
                const diff = height / 2 - player.y;
                player.y = height / 2;
                platforms.forEach(p => p.y += diff);
                
                // إزالة المنصات التي خرجت من الشاشة وتوليد أخرى
                platforms = platforms.filter(p => p.y < height + 50);
                
                // توليد منصات جديدة في الأعلى
                const highestPlatformY = Math.min(...platforms.map(p => p.y));
                while (platforms.length < 10) {
                    spawnPlatform(highestPlatformY - platformGap);
                }
            }

            // إذا سقط اللاعب تحت الشاشة
            if (player.y > height + player.radius) {
                gameOver();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            // رسم المنصات
            platforms.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.roundRect(p.x, p.y, platformWidth, platformHeight, 6);
                ctx.fill();
            });

            // إعادة ضبط التوهج للكرة
            ctx.shadowBlur = 20;
            ctx.shadowColor = player.color;
            
            // رسم الكرة
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // إضافة نقطة بيضاء داخل الكرة لجمالية أكثر
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(player.x - 5, player.y - 5, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        function gameOver() {
            isPlaying = false;
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

    </script>
</body>
</html>
